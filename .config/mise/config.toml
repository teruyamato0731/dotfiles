min_version = "2026.11.1"

[settings]
experimental = true
disable_backends = ["asdf", "vfox"]
minimum_release_age = "7d"
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"
not_found_auto_install = false

[bootstrap.repos]
"~/.local/share/zsh/plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab.git", ref = "24105b15714bfec37989ed5c5b6e60f572253019" }
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5" }
"~/.local/share/zsh/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git", ref = "1d85c692615a25fe2293bdd44b34c217d5d2bf04" }

[dotfiles]
"~/.profile/mise-activate" = { block = '''
if command -v mise >/dev/null 2>&1; then
  eval "$(mise activate bash --shims)"
fi
''' }
"~/.bashrc/custom" = { block = '''
if [ -f ~/.bashrc.custom ]; then
  source ~/.bashrc.custom
fi
''' }
"~/.bashrc.custom" = "~/dotfiles/.config/bash/.bashrc.custom"
"~/.gitconfig.custom" = "~/dotfiles/.config/git/.gitconfig.custom"
"~/.zshenv" = "~/dotfiles/.config/zsh/.zshenv"
"~/.config/git" = {}
"~/.config/lazygit" = {}
"~/.config/yazi" = {}
"~/.config/wezterm" = {}
"~/.config/zsh" = {}
"~/.config/starship.toml" = {}

[env]
_.path = ["{{env.HOME}}/dotfiles/bin"]
MANPAGER = "bat -plman"
VISUAL = "edit"
EDITOR = "edit"

FZF_DEFAULT_COMMAND = "fd --type f --hidden --exclude .git"
FZF_CTRL_T_COMMAND = "fd --hidden --exclude .git"
FZF_ALT_C_COMMAND = "fd --type d --hidden --exclude .git"
FZF_DEFAULT_OPTS = "--height 70% --layout reverse --border"
FZF_CTRL_T_OPTS = "--preview 'bat -n --color=always {} 2> /dev/null || eza --tree --level=2 --icons --color=always {}'"
FZF_ALT_C_OPTS = "--preview 'eza --tree --level=2 --icons --color=always {}'"

[shell_alias]
ls = 'eza --group-directories-first --icons'
ll = 'ls -l --git'
la = 'ls -la --git'
lt = 'ls -l --tree --git'
grep = 'grep --color=auto'
cat = 'bat --paging=never'
lg = 'lazygit'

[tools]
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:ClementTsang/bottom" = "0.15.0"
"aqua:astral-sh/uv" = "0.13.7"
"aqua:cli/cli" = "2.103.3"
"aqua:dandavison/delta" = "0.20.1"
"aqua:eza-community/eza" = "0.23.5"
"aqua:jdx/usage" = "7.2.0"
"aqua:jesseduffield/lazygit" = "0.66.2"
"aqua:junegunn/fzf" = "0.74.5"
"aqua:microsoft/edit" = "2.0.0"
"aqua:nektos/act" = "0.2.97"
"aqua:openai/codex" = "0.163.0"
"aqua:sharkdp/bat" = "0.26.1"
"aqua:sharkdp/fd" = "10.5.1"
"aqua:starship/starship" = "1.27.0"
"aqua:sxyazi/yazi" = "26.9.1"
"aqua:x-motemen/ghq" = "1.12.0"
