os:
  editPreset: vscode
  open: 'code "{{filename}}"'
  openLink: 'if [ -n "$BROWSER" ]; then "$BROWSER" "{{link}}"; else xdg-open "{{link}}"; fi'
  copyToClipboardCmd: 'printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty'
gui:
  language: "ja"
  nerdFontsVersion: "3"
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
    - colorArg: always
      command: delta --dark --paging=never --side-by-side
  log:
    showWholeGraph: true
